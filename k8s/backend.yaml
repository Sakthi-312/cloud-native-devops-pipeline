apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 947808343597.dkr.ecr.ap-south-1.amazonaws.com/terraform-portal-backend:v1
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef: { name: db-credentials, key: host }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: db-credentials, key: username }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: password }
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: db-credentials, key: dbname }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: portal
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
